buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath("com.anatawa12.forge:ForgeGradle:1.2-1.1.+") { changing = true }
    }
}

apply plugin: "forge"

version = "0.1.6-unofficial"
group = "toast.blockProperties"
archivesBaseName = "BlockProperties"

sourceCompatibility = 1.7
targetCompatibility = 1.7

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.7.10"
    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": "1.7.10"
    }
}

jar {
    manifest {
        attributes(
            "FMLCorePlugin": "toast.blockProperties.core.BlockPropertiesCorePlugin",
            "FMLCorePluginContainsFMLMod": "true"
        )
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
